services:
  agentmail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentmail
    restart: unless-stopped
    stdin_open: true
    tty: false
    environment:
      AGENTMAIL_DB_PATH: /data/agentmail.db
      AGENTMAIL_SYNC_INTERVAL_SECONDS: "300"
      AGENTMAIL_LOG_LEVEL: info
      AGENTMAIL_TRANSPORT: stdio
      AGENTMAIL_PRINCIPAL: ${AGENTMAIL_PRINCIPAL:?AGENTMAIL_PRINCIPAL is required}
      SECRET_FABRIC_URL: ${SECRET_FABRIC_URL:?SECRET_FABRIC_URL is required}
      SECRET_FABRIC_API_TOKEN: ${SECRET_FABRIC_API_TOKEN:?SECRET_FABRIC_API_TOKEN is required}
    network_mode: "host"
    volumes:
      - agentmail-data:/data

volumes:
  agentmail-data:
    name: agentmail-data
