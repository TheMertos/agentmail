services:
  agentmail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${AGENTMAIL_CONTAINER_NAME:-agentmail-default}
    restart: always
    stdin_open: true
    tty: false
    environment:
      AGENTMAIL_PROFILE: ${AGENTMAIL_PROFILE:-default}
      AGENTMAIL_PRINCIPAL: ${AGENTMAIL_PROFILE:-default}
      SECRET_FABRIC_PRINCIPAL: ${AGENTMAIL_PROFILE:-default}
      AGENTMAIL_DB_PATH: /data/agentmail.db
      AGENTMAIL_SYNC_INTERVAL_SECONDS: "300"
      AGENTMAIL_LOG_LEVEL: info
      AGENTMAIL_TRANSPORT: stdio
      SECRET_FABRIC_URL: ${SECRET_FABRIC_URL:?SECRET_FABRIC_URL is required}
      SECRET_FABRIC_API_TOKEN: ${SECRET_FABRIC_API_TOKEN:?SECRET_FABRIC_API_TOKEN is required}
    entrypoint: []
    command: ["node", "src/mcp/server.mjs"]
    network_mode: "host"
    volumes:
      - agentmail-data:/data

volumes:
  agentmail-data:
    name: ${AGENTMAIL_VOLUME_NAME:-agentmail-default-data}
